baseURL = "https://go-remoteexec.github.io/"
locale = "en-us"
title = "go-remoteexec"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/favicon.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 9.93:1, bright on the dark background 3.07:1.
  base = "#3730a3"
  deep = "#221d63"
  bright = "#4f46e5"
  shadow = "rgba(55,48,163,.7)"
  glow = "rgba(55,48,163,.6)"
  wash = "rgba(55,48,163,.10)"
  washDeep = "rgba(34,29,99,.06)"
  chipBg = "#eae9fc"
  chipBorder = "#cac8f7"
  chipFg = "#221d63"
  chipBgDark = "rgba(79,70,229,.14)"
  chipBorderDark = "rgba(79,70,229,.32)"
  chipFgDark = "#9e99f1"
  statsEnd = "#d5d3f9"
  bandText = "#e3e1fb"
  accent = "#3730a3"
  accentDark = "#726bea"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://pkg.go.dev/github.com/go-remoteexec/transport"
  label = "Reference"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-remoteexec"
  label = "GitHub"
